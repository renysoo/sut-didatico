name: testes
on:
  push: 
    paths-ignore: ['**/.md','/docs/*']
  workflow_dispatch:

jobs:
  regressao:
    name: "regressao"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: alo
        uses: actions/checkout@v5
        with:
          path: sut-didatico

      - name:
        uses: actions/checkout@v5
        with:
          repository: renysoo/tas-cidade-conectada
          ref: main
          path: tas

      - name: onde eu estou
        run: |
          echo "workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: suite de unitarios
        id: unidade
        working-directory: tas
        env:
          NODE_OPTIONS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=junit --test-reporter-destination=relatorios/unidade.xml
        run: |
          mkdir -p relatorios
          npm run test:unidade
